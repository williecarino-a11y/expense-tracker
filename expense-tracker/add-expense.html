<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense - Xylotix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="sub-page-body">

    <header class="app-header">
        <div class="header-left">
            <a href="index.html" class="back-link">← Back to Dashboard</a>
        </div>
        <h1>Add Expense</h1>
    </header>

    <main class="main-content-wrapper">
        <form id="add-expense-form" class="app-form">
            <div class="form-group">
                <label for="expense-amount">Amount ($)</label>
                <input type="number" id="expense-amount" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label for="expense-category">Category</label>
                <select id="expense-category" required>
                    <option value="food">Food & Groceries</option>
                    <option value="bills">Bills & Utilities</option>
                    <option value="shopping">Shopping</option>
                    <option value="transport">Transport</option>
                    <option value="others">Others</option>
                </select>
            </div>

            <div class="form-group">
                <label for="expense-date">Date</label>
                <input type="date" id="expense-date" required>
            </div>

            <div class="form-group">
                <label for="expense-note">Note (Optional)</label>
                <input type="text" id="expense-note" placeholder="What was this for?">
            </div>

            <button type="submit" class="btn-primary">Save Expense</button>
        </form>
    </main>

    <!-- Bottom Navigation Bar with proper padding clearance -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">Home</a>
        <a href="transactions.html" class="nav-item">Transactions</a>
        <a href="add-expense.html" class="nav-item active">Add</a>
        <a href="analytics.html" class="nav-item">Analytics</a>
        <a href="settings.html" class="nav-item">Settings</a>
    </nav>

    <style>
        body.sub-page-body {
            padding-bottom: 100px;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding-top: 20px;
        }
        .app-header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #222;
        }
        .back-link {
            color: #3b82f6;
            text-decoration: none;
            font-size: 14px;
        }
        .app-header h1 {
            font-size: 18px;
            margin: 0 auto;
        }
        .main-content-wrapper {
            padding: 20px;
        }
        .app-form .form-group {
            margin-bottom: 20px;
        }
        .app-form label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }
        .app-form input, .app-form select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            background: #3b82f6;
            color: #fff;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #121212;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #222;
            z-index: 1000;
        }
        .nav-item {
            color: #888;
            text-decoration: none;
            font-size: 12px;
        }
        .nav-item.active {
            color: #3b82f6;
        }
    </style>
</body>
</html>
