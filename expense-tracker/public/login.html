<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white flex items-center justify-center h-screen">
    <div class="w-full max-w-md p-6 bg-gray-900 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold mb-6 text-center">Welcome Back</h2>
        <form id="login-form">
            <div class="mb-4">
                <label class="block mb-2 text-sm">Email</label>
                <input type="email" id="email" class="w-full p-3 rounded bg-gray-800 border border-gray-700 text-white" required>
            </div>
            <div class="mb-6">
                <label class="block mb-2 text-sm">Password</label>
                <input type="password" id="password" class="w-full p-3 rounded bg-gray-800 border border-gray-700 text-white" required>
            </div>
            <button type="submit" class="w-full py-3 bg-blue-600 rounded font-bold hover:bg-blue-500">Sign In</button>
        </form>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Temporary mock login storage bypass to test dashboard flow
            localStorage.setItem('token', 'mock_secure_token_123');
            window.location.href = '/dashboard.html';
        });
    </script>
</body>
</html>
