<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Savings Goals</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .container {
            padding: 16px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .section-heading {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .goal-title {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .goal-amounts {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background-color: #0f172a;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: #38bdf8;
            border-radius: 5px;
        }
        .add-goal-btn {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }
        .add-goal-btn:hover {
            background-color: #2563eb;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.75rem;
            gap: 4px;
            cursor: pointer;
        }
        .nav-item.active {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <div class="header">
        <div class="logo">🎯 Savings Goals</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="section-heading">🏆 Active Financial Targets</div>
        
        <div class="card">
            <div class="goal-header">
                <span class="goal-title">🚀 Global App Infrastructure</span>
                <span class="goal-amounts">$3,500 / $5,000</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: 70%;"></div>
            </div>
        </div>

        <div class="card">
            <div class="goal-header">
                <span class="goal-title">🛡️ Emergency Buffer Fund</span>
                <span class="goal-amounts">$8,200 / $10,000</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: 82%; background-color: #34d399;"></div>
            </div>
        </div>

        <div class="card">
            <div class="goal-header">
                <span class="goal-title">💻 Advanced Workstation</span>
                <span class="goal-amounts">$1,200 / $2,500</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: 48%; background-color: #fbbf24;"></div>
            </div>

            <button class="add-goal-btn" onclick="alert('Create new savings goal modal opened!')">+ Create New Goal</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="/dashboard.html" class="nav-item">
            <span>🏠</span>
            <span>Home</span>
        </a>
        <a href="/transactions.html" class="nav-item">
            <span>💳</span>
            <span>Transactions</span>
        </a>
        <a href="/add.html" class="nav-item">
            <span>➕</span>
            <span>Add</span>
        </a>
        <a href="/analytics.html" class="nav-item">
            <span>📈</span>
            <span>Analytics</span>
        </a>
        <a href="/settings.html" class="nav-item">
            <span>⚙️</span>
            <span>Settings</span>
        </a>
    </div>

</body>
</html>
