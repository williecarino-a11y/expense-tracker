<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Analytics - Expense Tracker</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Top Header -->
    <div class="header">
        <div>Financial Analytics</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Line Chart Card -->
        <div class="card" style="margin-bottom: 20px;">
            <div style="font-weight: bold; margin-bottom: 10px; color: #ffafc7;">Deep-Dive Visual Reports</div>
            <div style="height: 220px; position: relative;">
                <canvas id="lineChart"></canvas>
            </div>
        </div>

        <!-- Bar Chart Card -->
        <div class="card" style="margin-bottom: 20px;">
            <div style="font-weight: bold; margin-bottom: 10px; color: #ffafc7;">Monthly Spending Trend</div>
            <div style="height: 220px; position: relative;">
                <canvas id="barChart"></canvas>
            </div>
        </div>

        <!-- Pie Chart Card -->
        <div class="card" style="margin-bottom: 20px;">
            <div style="font-weight: bold; margin-bottom: 10px; color: #ffafc7;">Expense Distribution</div>
            <div style="height: 220px; position: relative;">
                <canvas id="pieChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="/dashboard.html" class="nav-item"><span>🔥</span><span>Home</span></a>
        <a href="/transactions.html" class="nav-item"><span>📋</span><span>History</span></a>
        <a href="/add-expense.html" class="nav-item"><span>➕</span><span>Add</span></a>
        <a href="/analytics.html" class="nav-item active"><span>📊</span><span>Analytics</span></a>
        <a href="/settings.html" class="nav-item"><span>⚙️</span><span>Settings</span></a>
    </div>

    <script>
        // 1. Line Chart
        const ctxLine = document.getElementById('lineChart').getContext('2d');
        new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{
                    label: 'Spending ($)',
                    data: [1200, 1900, 1500, 2200, 1800, 2400],
                    borderColor: '#f87171',
                    backgroundColor: 'rgba(248, 113, 113, 0.1)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
                    y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                }
            }
        });

        // 2. Bar Chart
        const ctxBar = document.getElementById('barChart').getContext('2d');
        new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: ['Food', 'Bills', 'Tech', 'Travel', 'Misc'],
                datasets: [{
                    label: 'Amount ($)',
                    data: [450, 600, 350, 500, 200],
                    backgroundColor: '#f87171',
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
                    y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                }
            }
        });

        // 3. Pie Chart
        const ctxPie = document.getElementById('pieChart').getContext('2d');
        new Chart(ctxPie, {
            type: 'pie',
            data: {
                labels: ['Food', 'Bills', 'Tech', 'Travel', 'Misc'],
                datasets: [{
                    data: [450, 600, 350, 500, 200],
                    backgroundColor: ['#f87171', '#fbbf24', '#38bdf8', '#34d399', '#a78bfa'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { color: '#e2e8f0', boxWidth: 12 }
                    }
                }
            }
        });
    </script>
</body>
</html>
