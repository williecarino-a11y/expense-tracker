<body>

    <div class="card">
        <h2>Expense Tracker</h2>
        <p class="subtitle" id="form-subtitle">Manage your finances seamlessly</p>
        
        <div class="tab-container" id="main-tabs">
            <button class="tab active" id="login-tab" onclick="switchMode('login')">Log In</button>
            <button class="tab" id="signup-tab" onclick="switchMode('signup')">Sign Up</button>
        </div>
        
        <div id="form-container">
            <!-- Separate Fields for Surname and First Name -->
            <div class="name-row" id="name-group" style="display: none;">
                <div class="input-group">
                    <label for="surname">Surname</label>
                    <input type="text" id="surname" placeholder="Chinaza">
                </div>
                <div class="input-group">
                    <label for="firstname">First Name</label>
                    <input type="text" id="firstname" placeholder="Solomon">
                </div>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com">
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            
            <button class="action-btn" id="submit-btn" onclick="handleAuth()">Log In</button>
        </div>
        
        <div class="message" id="response-msg"></div>
    </div>

    <script>
        let isSignup = false;

        function switchMode(mode) {
            const loginTab = document.getElementById('login-tab');
            const signupTab = document.getElementById('signup-tab');
            const submitBtn = document.getElementById('submit-btn');
            const nameGroup = document.getElementById('name-group');
            const subtitle = document.getElementById('form-subtitle');
            const msg = document.getElementById('response-msg');
            
            msg.textContent = '';

            if (mode === 'signup') {
                isSignup = true;
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                nameGroup.style.display = 'flex';
                submitBtn.textContent = 'Create Account';
                subtitle.textContent = 'Create your account to get started';
            } else {
                isSignup = false;
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                nameGroup.style.display = 'none';
                submitBtn.textContent = 'Log In';
                subtitle.textContent = 'Manage your finances seamlessly';
            }
        }

        async function handleAuth() {
            const msg = document.getElementById('response-msg');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            let payload = { email, password };
            let endpoint = isSignup ? '/api/auth/register' : '/api/auth/login';

            if (isSignup) {
                const surnameInput = document.getElementById('surname');
                const firstnameInput = document.getElementById('firstname');
                
                const surname = surnameInput ? surnameInput.value.trim() : '';
                const firstname = firstnameInput ? firstnameInput.value.trim() : '';

                if (!surname || !firstname || !email || !password) {
                    msg.style.color = '#dc2626';
                    msg.textContent = 'Please fill in all required fields.';
                    return;
                }

                // Explicitly send both fields and the combined name string
                payload.surname = surname;
                payload.firstname = firstname;
                payload.name = `${surname}, ${firstname}`;
            } else {
                if (!email || !password) {
                    msg.style.color = '#dc2626';
                    msg.textContent = 'Please fill in all required fields.';
                    return;
                }
            }

            msg.style.color = '#4b5563';
            msg.textContent = 'Processing...';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (res.ok) {
                    msg.style.color = '#16a34a';
                    msg.textContent = isSignup ? 'Success! Account created.' : 'Success! Logged in.';
                } else {
                    msg.style.color = '#dc2626';
                    msg.textContent = data.message || data.error || 'Authentication failed.';
                }
            } catch (err) {
                msg.style.color = '#dc2626';
                msg.textContent = 'Error connecting to server.';
            }
        }
    </script>
<footer>
