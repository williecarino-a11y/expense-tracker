<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xylotix Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <!-- Header Section -->
    <header class="app-header">
        <div class="header-left">
            <span class="menu-toggle" id="menu-toggle">☰</span>
        </div>
        <div class="header-right">
            <span class="notification-icon">🔔</span>
            <span class="profile-icon" id="logout-btn" style="cursor: pointer;" title="logout">🚪</span>
        </div>
    </header>

    <!-- Main Dashboard Content -->
    <main class="main-content-wrapper">
        
        <!-- Dynamic Greeting & Insight Section -->
        <section class="welcome-section">
            <h2 id="user-greeting">Welcome back</h2>
            <p class="insight-badge" id="insight-badge">Loading spending insights...</p>
        </section>

        <!-- Main Balance Card -->
        <div class="balance-card">
            <p>Total Balance</p>
            <h1 class="total-balance-amount">$0.00</h1>
        </div>

        <!-- Quick Statistics Mini-Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <span>Income</span>
                <h3 class="income-amount">$0.00</h3>
            </div>
            <div class="stat-card">
                <span>Expenses</span>
                <h3 class="expenses-amount">$0.00</h3>
            </div>
            <div class="stat-card">
                <span>Savings</span>
                <h3 class="savings-amount">$0.00</h3>
            </div>
        </div>

        <!-- Recent Transactions -->
        <div class="section-header">
            <h3>Recent Transactions</h3>
            <a href="transactions.html">See All</a>
        </div>
        
        <div class="transactions-list recent-transactions-container">
            <!-- Dynamically populated transaction rows will appear here -->
        </div>

    </main>

    <!-- Dashboard Script for Dynamic Data & Time-based Greeting -->
    <script>
        // 1. Set dynamic time-based greeting for Willie
        function setDynamicGreeting() {
            const greetingElement = document.getElementById('user-greeting');
            const hour = new Date().getHours();
            let timeGreeting = "Good evening";

            if (hour < 12) {
                timeGreeting = "Good morning";
            } else if (hour < 18) {
                timeGreeting = "Good afternoon";
            }

            greetingElement.textContent = `${timeGreeting}, Willie`;
        }

        // 2. Fetch live dashboard data and update DOM
        async function fetchDashboardData() {
            try {
                const response = await fetch('/api/dashboard');
                const data = await response.json();

                if (data.success) {
                    // Update main cards
                    document.querySelector('.total-balance-amount').textContent = `$${Number(data.totalBalance || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                    document.querySelector('.income-amount').textContent = `$${Number(data.totalIncome || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                    document.querySelector('.expenses-amount').textContent = `$${Number(data.totalExpenses || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                    document.querySelector('.savings-amount').textContent = `$${Number(data.totalSavings || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

                    // Update dynamic spending comparison insight
                    const badge = document.getElementById('insight-badge');
                    if (badge) {
                        const current = Number(data.currentMonthExpenses || data.totalExpenses || 0);
                        badge.textContent = `Current tracked expenses total $${current.toFixed(2)}`;
                    }

                    // Populate recent transactions feed
                    const container = document.querySelector('.recent-transactions-container');
                    if (container && data.recentTransactions) {
                        container.innerHTML = '';
                        
                        if (data.recentTransactions.length === 0) {
                            container.innerHTML = '<p class="no-tx" style="padding: 10px; text-align: center; color: #888;">No transactions found.</p>';
                            return;
                        }

                        data.recentTransactions.forEach(tx => {
                            const txElement = document.createElement('div');
                            txElement.className = 'transaction-item';
                            const txDate = new Date(tx.createdAt || tx.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                            
                            txElement.innerHTML = `
                                <div class="tx-info">
                                    <h4 class="tx-title">${tx.title || tx.category || 'Transaction'}</h4>
                                    <p class="tx-date">${txDate}</p>
                                </div>
                                <div class="tx-amount ${tx.type}">${tx.type === 'expense' ? '-' : '+'}$${Number(tx.amount || 0).toFixed(2)}</div>
                            `;
                            container.appendChild(txElement);
                        });
                    }
                }
            } catch (error) {
                console.error('Error fetching dashboard summary:', error);
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            setDynamicGreeting();
            fetchDashboardData();
        });

        // Logout functionality
        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                localStorage.removeItem('token');
                window.location.href = '/index.html';
            });
        }
    </script>
</body>
</html>
