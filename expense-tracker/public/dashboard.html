<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .top-banner {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }
        .top-banner h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 0.5px;
        }
        .dashboard-container {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 15px;
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .card h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        .amount {
            font-size: 28px;
            font-weight: bold;
            color: #27ae60;
            margin: 10px 0 0 0;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .menu-container {
            position: relative;
        }
        .three-dots-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0 5px;
        }
        .dropdown-content {
            position: absolute;
            right: 0;
            top: 35px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 100;
            min-width: 140px;
            overflow: hidden;
        }
        .dropdown-content a, .dropdown-content button {
            display: block;
            width: 100%;
            padding: 10px 15px;
            text-align: left;
            background: none;
            border: none;
            font-size: 14px;
            color: #333;
            text-decoration: none;
            cursor: pointer;
        }
        .dropdown-content a:hover, .dropdown-content button:hover {
            background-color: #f1f1f1;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="top-banner">
        <h1>Expense Tracker</h1>
        <div class="menu-container">
            <button id="menu-toggle" class="three-dots-btn" onclick="document.getElementById('dropdown-menu').classList.toggle('hidden')">⋮</button>
            <div id="dropdown-menu" class="dropdown-content hidden">
                <button id="upgrade-btn">Upgrade to Pro</button>
                <a href="/logout" style="color: #dc3545; font-weight: bold;">Log Out</a>
            </div>
        </div>
    </div>

    <div class="dashboard-container">
        <h2>Dashboard</h2>

        <div class="card">
            <div style="margin-bottom: 15px;">
                <label for="currency-select">Select Currency:</label>
                <select id="currency-select" onchange="changeCurrency(this.value)">
                    <option value="USD">USD ($)</option>
                    <option value="NGN">NGN (₦)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="GBP">GBP (£)</option>
                </select>
            </div>
            <h3>Current Month Total</h3>
            <p class="amount" id="total-amount">$0.00</p>
        </div>

        <script>
        const currencySymbols = {
            'USD': '$',
            'NGN': '₦',
            'EUR': '€',
            'GBP': '£'
        };

        let currentCurrency = localStorage.getItem('selectedCurrency') || 'USD';
        document.getElementById('currency-select').value = currentCurrency;

        function changeCurrency(val) {
            currentCurrency = val;
            localStorage.setItem('selectedCurrency', val);
            loadMonthTotal();
        }

        async function loadMonthTotal() {
            try {
                const response = await fetch('/api/expenses/total');
                const data = await response.json();
                const symbol = currencySymbols[currentCurrency] || '$';
                document.getElementById('total-amount').innerText = `${symbol}${data.total.toFixed(2)}`;
            } catch (err) {
                console.error('Failed to load total', err);
            }
        }

        loadMonthTotal();
        </script>

        <div class="card">
            <h3>Add New Expense</h3>
            <form id="expense-form">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="e.g. 5000" required>
                
                <label for="category">Category</label>
                <select id="category" required>
                    <option value="Food & Groceries">Food & Groceries</option>
                    <option value="Rent & Utilities">Rent & Utilities</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Others">Others</option>
                </select>

                <label for="note">Note (Optional)</label>
                <input type="text" id="note" placeholder="What was this for?">

                <button type="submit" class="btn">Add Expense</button>
            </form>
        </div>

        <div class="card">
            <h3>Recent Transactions</h3>
            <div id="transactions-list">
                <p style="color: #666;">No transactions recorded yet.</p>
            </div>
        </div>
    </div>
</body>
</html>
