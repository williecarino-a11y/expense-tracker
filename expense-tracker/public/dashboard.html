<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <h2>Expense Tracker Dashboard</h2>
    
    <div class="menu-container">
        <button id="menu-toggle" class="three-dots-btn" aria-label="Menu">⋮</button>
        <div id="dropdown-menu" class="dropdown-content hidden">
            <button id="upgrade-btn" class="menu-item">Upgrade to Pro</button>
            <a href="/logout" class="menu-item logout-link">Log Out</a>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="card">
            <div style="margin-bottom: 10px;">
                <label for="currency-select" style="font-size: 14px;">Currency: </label>
                <select id="currency-select" onchange="changeCurrency(this.value)" style="padding: 3px;">
                    <option value="USD">USD ($)</option>
                    <option value="NGN">NGN (₦)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="GBP">GBP (£)</option>
                </select>
            </div>
            <h3>Current Month Total</h3>
            <p class="amount" id="total-amount">$0.00</p>
        </div>

        <script>
        const currencySymbols = {
            'USD': '$',
            'NGN': '₦',
            'EUR': '€',
            'GBP': '£'
        };

        let currentCurrency = localStorage.getItem('selectedCurrency') || 'USD';
        document.getElementById('currency-select').value = currentCurrency;

        function changeCurrency(val) {
            currentCurrency = val;
            localStorage.setItem('selectedCurrency', val);
            loadMonthTotal();
        }

        async function loadMonthTotal() {
            try {
                const response = await fetch('/api/expenses/total');
                const data = await response.json();
                const symbol = currencySymbols[currentCurrency] || '$';
                document.getElementById('total-amount').innerText = `${symbol}${data.total.toFixed(2)}`;
            } catch (err) {
                console.error('Failed to load total', err);
            }
        }

        loadMonthTotal();
        </script>

        <div class="card">
            <h3>Add New Expense</h3>
            <form id="expense-form">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" placeholder="e.g. 5000" required>
                
                <label for="category">Category</label>
                <select id="category" required>
                    <option value="Food & Groceries">Food & Groceries</option>
                    <option value="Rent & Utilities">Rent & Utilities</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Others">Others</option>
                </select>

                <label for="note">Note (Optional)</label>
                <input type="text" id="note" placeholder="What was this for?">

                <button type="submit" class="btn">Add Expense</button>
            </form>
        </div>

        <div class="card">
            <h3>Recent Transactions</h3>
            <div id="transactions-list">
                <p>No transactions recorded yet.</p>
            </div>
        </div>
    </div>
</body>
</html>
