<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xylotix Dashboard</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="dashboard-body">

  <!-- Header Section -->
  <header class="app-header">
    <div class="header-left">
      <span class="menu-toggle" id="menu-toggle">&#9776;</span>
    </div>
    <div class="header-right">
      <span class="notification-icon" id="notif-btn">🔔</span>
      <span class="profile-icon" id="logout-btn" style="cursor: pointer;" title="Logout">👤</span>
    </div>
  </header>

  <!-- Main Dashboard Content -->
  <main class="main-content-wrapper">
    
    <!-- Dynamic Greeting & Insight Section -->
    <section class="welcome-section">
      <h2 id="user-greeting">Welcome</h2>
      <p class="insight-badge" id="insight-badge">Loading spending insights...</p>
    </section>

    <!-- Main Balance Card -->
    <div class="balance-card">
      <p>Total Balance</p>
      <h1 class="total-balance-amount" id="total-balance">$0.00</h1>
    </div>

    <!-- Quick Statistics 3-Column Cards Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <span>Income</span>
        <h3 id="income-amount" class="income">$0.00</h3>
      </div>
      <div class="stat-card">
        <span>Expenses</span>
        <h3 id="expenses-amount">$0.00</h3>
      </div>
      <div class="stat-card">
        <span>Savings</span>
        <h3 id="savings-amount">$0.00</h3>
      </div>
    </div>

    <!-- Recent Transactions Container Section -->
    <section class="transactions-section">
      <div class="section-header">
        <h3>Recent Transactions</h3>
        <a href="/transactions.html" id="see-all-link" style="color: #a855f7; text-decoration: none; font-size: 0.9rem;">See All</a>
      </div>
      <div id="transactions-list-container">
        <!-- Dynamic transaction rows inject here -->
      </div>
    </section>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="nav-bar">
    <a href="/dashboard.html" class="nav-item active">
      <span>🏠</span>
      <span>Home</span>
    </a>
    <a href="/transactions.html" class="nav-item">
      <span>📊</span>
      <span>Transactions</span>
    </a>
    <a href="/add.html" class="nav-item">
      <span>➕</span>
      <span>Add</span>
    </a>
    <a href="/analytics.html" class="nav-item">
      <span>📈</span>
      <span>Analytics</span>
    </a>
    <a href="/settings.html" class="nav-item">
      <span>⚙️</span>
      <span>Settings</span>
    </a>
  </nav>

  <script>
    // Dynamic Time-based Greeting Function
    function setDynamicGreeting(userName = 'User') {
      const greetingEl = document.getElementById('user-greeting');
      if (!greetingEl) return;

      const hour = new Date().getHours();
      let timeOfDay = 'Morning';
      
      if (hour >= 12 && hour < 17) {
        timeOfDay = 'Afternoon';
      } else if (hour >= 17) {
        timeOfDay = 'Evening';
      }

      greetingEl.innerText = `Good ${timeOfDay}, ${userName}`;
    }

    // Fetch dashboard summary and populate fields
    async function fetchDashboardData() {
      try {
        const token = localStorage.getItem('token');
        const res = await fetch('/api/dashboard', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        
        if (document.getElementById('total-balance')) {
          document.getElementById('total-balance').innerText = `$${(data.totalBalance || 0).toFixed(2)}`;
        }
        if (document.getElementById('income-amount')) {
          document.getElementById('income-amount').innerText = `$${(data.totalIncome || 0).toFixed(2)}`;
        }
        if (document.getElementById('expenses-amount')) {
          document.getElementById('expenses-amount').innerText = `$${(data.totalExpenses || 0).toFixed(2)}`;
        }
        if (document.getElementById('savings-amount')) {
          document.getElementById('savings-amount').innerText = `$${(data.totalSavings || 0).toFixed(2)}`;
        }

        const activeName = data.name || localStorage.getItem('username') || 'User';
        setDynamicGreeting(activeName);
      } catch (err) {
        console.error('Error fetching dashboard data:', err);
        setDynamicGreeting(localStorage.getItem('username') || 'User');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchDashboardData();
    });

    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        window.location.href = '/index.html';
      });
    }
  </script>
</body>
</html>
