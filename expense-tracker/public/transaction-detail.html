<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Details</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --card-border: #2c2c2c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; text-align: center; }
        .card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            padding: 25px; border-radius: 16px; margin-bottom: 20px;
        }
        .tx-title { font-size: 20px; font-weight: 600; margin: 10px 0; }
        .tx-amount { font-size: 24px; font-weight: 700; color: #e74c3c; margin-bottom: 15px; }
        .tx-date { font-size: 14px; opacity: 0.6; margin-bottom: 5px; }
        .btn-danger {
            background-color: #e74c3c; color: white; border: none;
            width: 100%; padding: 14px; border-radius: 12px; font-size: 16px;
            font-weight: 600; cursor: pointer; margin-bottom: 10px;
        }
        .btn-secondary {
            background-color: transparent; color: var(--text-color); border: 1px solid var(--card-border);
            width: 100%; padding: 14px; border-radius: 12px; font-size: 16px;
            text-decoration: none; display: block; box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="tx-details">
            <p>Loading transaction details...</p>
        </div>
        <button class="btn-danger" id="delete-btn" style="display:none;" onclick="deleteCurrentTransaction()">Delete Transaction</button>
        <a href="/d" class="btn-secondary">Back to Dashboard</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const txId = urlParams.get('id');

        async function fetchDetails() {
            if (!txId) {
                document.getElementById('tx-details').innerHTML = `<p>No transaction specified.</p>`;
                return;
            }
            try {
                const res = await fetch('/api/expenses');
                const expenses = await res.json();
                const tx = expenses.find(e => e._id === txId);

                if (!tx) {
                    document.getElementById('tx-details').innerHTML = `<p>Transaction not found.</p>`;
                    return;
                }

                const dateStr = new Date(tx.date || tx.createdAt || Date.now()).toLocaleDateString();
                document.getElementById('tx-details').innerHTML = `
                    <div style="font-size: 32px;">📄</div>
                    <div class="tx-title">${tx.title || tx.category}</div>
                    <div class="tx-amount">-$${Number(tx.amount).toFixed(2)}</div>
                    <div class="tx-date">Date: ${dateStr}</div>
                    <div style="font-size: 13px; opacity: 0.5; margin-top: 10px;">Category: ${tx.category || 'General'}</div>
                `;
                document.getElementById('delete-btn').style.display = 'block';
            } catch (err) {
                console.error(err);
                document.getElementById('tx-details').innerHTML = `<p style="color: #e74c3c;">Failed to load transaction details.</p>`;
            }
        }

        async function deleteCurrentTransaction() {
            if (!confirm("Are you sure you want to delete this transaction?")) return;
            try {
                const res = await fetch(`/api/expenses/${txId}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    window.location.href = '/d';
                } else {
                    alert("Failed to delete transaction.");
                }
            } catch (err) {
                console.error(err);
                alert("Error connecting to server.");
            }
        }

        fetchDetails();
    </script>
</body>
</html>
