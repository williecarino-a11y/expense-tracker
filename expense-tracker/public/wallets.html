<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Wallets & Accounts</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .container {
            padding: 16px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .section-heading {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .wallet-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
        }
        .wallet-item:last-child {
            border-bottom: none;
        }
        .wallet-info h4 {
            margin: 0 0 4px 0;
            font-size: 0.95rem;
            color: #f8fafc;
        }
        .wallet-info p {
            margin: 0;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .wallet-balance {
            font-weight: bold;
            font-size: 1rem;
            color: #38bdf8;
        }
        .add-wallet-btn {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }
        .add-wallet-btn:hover {
            background-color: #2563eb;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.75rem;
            gap: 4px;
            cursor: pointer;
        }
        .nav-item.active {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <div class="header">
        <div class="logo">💼 Wallets & Accounts</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="section-heading">💳 Connected Financial Accounts</div>
        
        <div class="card">
            <div class="wallet-item">
                <div class="wallet-info">
                    <h4>Primary Checking</h4>
                    <p>Global Bank • ****4821</p>
                </div>
                <div class="wallet-balance">$4,250.00</div>
            </div>

            <div class="wallet-item">
                <div class="wallet-info">
                    <h4>Savings Reserve</h4>
                    <p>Cloud Treasury • ****9012</p>
                </div>
                <div class="wallet-balance">$12,800.50</div>
            </div>

            <div class="wallet-item">
                <div class="wallet-info">
                    <h4>Crypto Vault</h4>
                    <p>Solana / Multi-Chain • Web3</p>
                </div>
                <div class="wallet-balance">$1,420.75</div>
            </div>

            <button class="add-wallet-btn" onclick="alert('Link new account modal opened!')">+ Connect New Account</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="/dashboard.html" class="nav-item">
            <span>🏠</span>
            <span>Home</span>
        </a>
        <a href="/transactions.html" class="nav-item">
            <span>💳</span>
            <span>Transactions</span>
        </a>
        <a href="/add.html" class="nav-item">
            <span>➕</span>
            <span>Add</span>
        </a>
        <a href="/analytics.html" class="nav-item">
            <span>📈</span>
            <span>Analytics</span>
        </a>
        <a href="/settings.html" class="nav-item">
            <span>⚙️</span>
            <span>Settings</span>
        </a>
    </div>

</body>
</html>
