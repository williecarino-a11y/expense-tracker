<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Payment Integration</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .container {
            padding: 16px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .section-heading {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .form-input, .form-select {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .paystack-btn {
            background-color: #00c3f7;
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .paystack-btn:hover {
            background-color: #00b0e0;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.75rem;
            gap: 4px;
            cursor: pointer;
        }
        .nav-item.active {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <div class="header">
        <div class="logo">💳 Payment Gateway</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="section-heading">⚡ Paystack Pro Checkout</div>
        
        <div class="card">
            <form id="paymentForm">
                <div class="form-group">
                    <label class="form-label">Subscription Tier / Service</label>
                    <select class="form-select" id="payTier">
                        <option value="pro">Pro Workspace Tier ($15.00 / mo)</option>
                        <option value="enterprise">Enterprise Cloud Tier ($49.00 / mo)</option>
                        <option value="api">API Developer Add-on ($9.00 / mo)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Billing Email Address</label>
                    <input type="email" class="form-input" id="email-address" placeholder="willie@xyoltix.app" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Amount (USD)</label>
                    <input type="number" class="form-input" id="amount" value="15.00" readonly>
                </div>

                <button type="submit" class="paystack-btn">Pay with Paystack 🔒</button>
            </form>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="/dashboard.html" class="nav-item">
            <span>🏠</span>
            <span>Home</span>
        </a>
        <a href="/transactions.html" class="nav-item">
            <span>💳</span>
            <span>Transactions</span>
        </a>
        <a href="/add.html" class="nav-item">
            <span>➕</span>
            <span>Add</span>
        </a>
        <a href="/analytics.html" class="nav-item">
            <span>📈</span>
            <span>Analytics</span>
        </a>
        <a href="/settings.html" class="nav-item">
            <span>⚙️</span>
            <span>Settings</span>
        </a>
    </div>

    <script>
        document.getElementById('paymentForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Paystack transaction initialized successfully via webhook routing!');
        });
    </script>
</body>
</html>
