<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); }
        .auth-header { text-align: center; margin-bottom: 24px; }
        .auth-header h1 { font-size: 1.5rem; margin-bottom: 8px; color: white; }
        .auth-header p { color: #94a3b8; font-size: 0.9rem; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 0.95rem; }
        .form-group input:focus { outline: none; border-color: #3b82f6; }
        .auth-btn { width: 100%; padding: 12px; background: #3b82f6; border: none; border-radius: 8px; color: white; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .auth-btn:hover { background: #2563eb; }
        .auth-switch { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #94a3b8; }
        .auth-switch a { color: #3b82f6; text-decoration: none; font-weight: 600; }
        .auth-switch a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <span style="font-size: 2.5rem;">💰</span>
            <h1 id="formTitle">Welcome Back</h1>
            <p id="formSubtitle">Please enter your details to sign in</p>
        </div>

        <form id="authForm">
            <div class="form-group" id="nameGroup" style="display: none;">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="auth-btn" id="submitBtn">Sign In</button>
        </form>

        <div class="auth-switch">
            <span id="switchText">Don't have an account?</span> 
            <a href="#" id="switchModeBtn">Create an account</a>
        </div>
    </div>

    <script>
        let isLogin = true;
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const nameGroup = document.getElementById('nameGroup');
        const submitBtn = document.getElementById('submitBtn');
        const switchText = document.getElementById('switchText');
        const switchModeBtn = document.getElementById('switchModeBtn');
        const authForm = document.getElementById('authForm');

        switchModeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            if (isLogin) {
                formTitle.textContent = "Welcome Back";
                formSubtitle.textContent = "Please enter your details to sign in";
                nameGroup.style.display = "none";
                submitBtn.textContent = "Sign In";
                switchText.textContent = "Don't have an account?";
                switchModeBtn.textContent = "Create an account";
            } else {
                formTitle.textContent = "Create Account";
                formSubtitle.textContent = "Sign up to start managing your global finances";
                nameGroup.style.display = "block";
                submitBtn.textContent = "Sign Up";
                switchText.textContent = "Already have an account?";
                switchModeBtn.textContent = "Login with email";
            }
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;

            const endpoint = isLogin ? '/api/login' : '/api/signup';
            const payload = isLogin ? { email, password } : { name, email, password };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = '/dashboard.html';
                } else {
                    alert(data.message || 'Authentication failed');
                }
            } catch (err) {
                console.error('Auth error:', err);
                alert('An error occurred during authentication.');
            }
        });
    </script>
</body>
</html>
