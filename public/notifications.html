<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xylotix - Notifications & Reminders</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body style="background: #0f172a; color: white; font-family: sans-serif; padding: 20px; margin: 0; padding-bottom: 80px;">
    <div style="max-width: 600px; margin: 0 auto;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
            <h1 style="font-size: 1.5rem; color: #38bdf8; margin: 0;">Reminders & Alerts</h1>
            <a href="/dashboard.html" style="color: #94a3b8; text-decoration: none; font-size: 0.9rem;">&larr; Back</a>
        </div>

        <!-- Add Reminder Card -->
        <div style="background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
            <h3 style="font-size: 1.1rem; margin-bottom: 15px; color: #38bdf8;">Add Recurring Bill Reminder</h3>
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 0.9rem; margin-bottom: 5px; color: #94a3b8;">Bill / Expense Name</label>
                <input type="text" id="bill-name" placeholder="e.g., Cloud Server Hosting" style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 0.9rem; margin-bottom: 5px; color: #94a3b8;">Due Date</label>
                <input type="date" id="bill-date" style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; box-sizing: border-box;">
            </div>
            <button style="width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;">Set Reminder</button>
        </div>

        <!-- Active Alerts List -->
        <div style="background: #1e293b; padding: 20px; border-radius: 12px;">
            <h3 style="font-size: 1.1rem; margin-bottom: 15px; color: #38bdf8;">Upcoming Alerts</h3>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #334155;">
                <div>
                    <span style="display: block; font-weight: bold;">Cloud Server Hosting</span>
                    <span style="font-size: 0.8rem; color: #94a3b8;">Due in 3 days</span>
                </div>
                <span style="font-size: 0.8rem; background: #334155; padding: 4px 8px; border-radius: 4px; color: #38bdf8;">Active</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0;">
                <div>
                    <span style="display: block; font-weight: bold;">Monthly Budget Warning (80%)</span>
                    <span style="font-size: 0.8rem; color: #94a3b8;">Triggered on threshold</span>
                </div>
                <span style="font-size: 0.8rem; background: #334155; padding: 4px 8px; border-radius: 4px; color: #10b981;">Enabled</span>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar" style="position: fixed; bottom: 0; left: 0; width: 100%; background: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-around; padding: 12px 0;">
        <a href="/dashboard.html" class="nav-item" style="color: #94a3b8; text-decoration: none; font-size: 0.8rem;">Dashboard</a>
        <a href="/reports.html" class="nav-item" style="color: #94a3b8; text-decoration: none; font-size: 0.8rem;">Reports</a>
        <a href="/settings.html" class="nav-item" style="color: #94a3b8; text-decoration: none; font-size: 0.8rem;">Settings</a>
    </div>
</body>
</html>
