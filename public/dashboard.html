<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Expense Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="header">
        <div>Dashboard</div>
        <a href="/settings.html" style="color: #f87171; text-decoration: none; font-size: 1.2rem;">⚙️</a>
    </div>

    <div class="container">
        <!-- Welcome Card -->
        <div class="card" style="margin-bottom: 16px;">
          <div id="welcomeMessage" style="font-size: 1.1rem; font-weight: bold; color: #38bdf8;">👋 Welcome back</div>
            <div style="font-size: 0.85rem; color: #94a3b8; margin-top: 4px;">Global multi-tier tracking active.</div>
        </div>

        <!-- Balance Card -->
        <div class="card" style="margin-bottom: 16px;">
            <div style="font-size: 0.85rem; color: #94a3b8;">Total Balance</div>
            <div id="totalBalance" style="font-size: 1.8rem; font-weight: bold; margin: 8px 0;">$0.00</div>
            <div style="display: flex; gap: 10px; margin-top: 12px;">
                <a href="/add-expense.html" style="flex: 1; text-align: center; background: #22c55e; color: white; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.9rem;">+ Add Income</a>
                <a href="/add-expense.html" style="flex: 1; text-align: center; background: #ef4444; color: white; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.9rem;">- Add Expense</a>
            </div>
        </div>

        <!-- Live Transactions Card -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <span style="font-weight: bold; color: #ffafc7;">Recent Activity</span>
                <a href="/transactions.html" style="font-size: 0.8rem; color: #38bdf8; text-decoration: none;">View All</a>
            </div>
            <div id="transactionList">
                <div style="color: #94a3b8; font-size: 0.9rem; text-align: center; padding: 20px;">Loading live transactions from database...</div>
            </div>
        </div>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <a href="/dashboard.html" class="nav-item active"><span>🏠</span><span>Home</span></a>
        <a href="/transactions.html" class="nav-item"><span>📋</span><span>History</span></a>
        <a href="/add-expense.html" class="nav-item"><span>➕</span><span>Add</span></a>
        <a href="/analytics.html" class="nav-item"><span>📊</span><span>Analytics</span></a>
        <a href="/settings.html" class="nav-item"><span>⚙️</span><span>Settings</span></a>
    </div>

    <script>
        async function loadDashboardData() {
            try {
                const res = await fetch('/api/transactions');
                const data = await res.json();
                
                const listEl = document.getElementById('transactionList');
                const balanceEl = document.getElementById('totalBalance');
                
                if (!data || data.length === 0) {
                    listEl.innerHTML = '<div style="color: #94a3b8; font-size: 0.9rem; text-align: center; padding: 20px;">No transactions recorded yet. Click Add to start!</div>';
                    balanceEl.textContent = '$0.00';
                    return;
                }

                let total = 0;
                listEl.innerHTML = '';
                
                // Show last 4 recent items dynamically
                data.slice(-4).reverse().forEach(tx => {
                    const isIncome = tx.type === 'income';
                    total += isIncome ? Number(tx.amount) : -Number(tx.amount);
                    
                    const item = document.createElement('div');
                    item.className = 'transaction-item';
                    item.innerHTML = `
                        <div>
                            <div style="font-weight: bold; font-size: 0.95rem;">${tx.title}</div>
                            <div style="font-size: 0.75rem; color: #94a3b8;">${tx.category} • ${new Date(tx.date).toLocaleDateString()}</div>
                        </div>
                        <div class="tx-amount ${isIncome ? 'income' : 'expense'}">
                            ${isIncome ? '+' : '-'}$${Number(tx.amount).toFixed(2)}
                        </div>
                    `;
                    listEl.appendChild(item);
                });

                balanceEl.textContent = `$${total.toFixed(2)}`;
            } catch (err) {
                console.error('Failed to load transactions:', err);
            }
        }
        loadDashboardData();
    <script>
// --- UI Layout State Persistence ---
window.addEventListener('beforeunload', () => {
    const activeTab = document.querySelector('.tab-pane.active')?.id || 'dashboard';
    localStorage.setItem('preferred_tab', activeTab);
});

document.addEventListener('DOMContentLoaded', () => {
    const savedTab = localStorage.getItem('preferred_tab');
    if (savedTab) {
        const targetTab = document.getElementById(savedTab);
        if (targetTab && typeof switchTab === 'function') {
            switchTab(savedTab);
        }
    }
});
// --- Dynamic User Profile Greeting Loader ---
async function loadUserProfile() {
    try {
        const res = await fetch('/api/user/profile');
        const userData = await res.json();
        
        if (userData && userData.name) {
            const greetingEl = document.getElementById('welcomeMessage');
            if (greetingEl) {
                greetingEl.textContent = `Good Morning, ${userData.name}`;
            }
            const sidebarNameEl = document.getElementById('sidebarUserName');
            if (sidebarNameEl) {
                sidebarNameEl.textContent = userData.name;
            }
        }
    } catch (err) {
        console.error('Failed to load user profile name:', err);
    }
}

// --- Dynamic Event-Driven Notification System ---
let appNotifications = [
    { text: "🎉 Welcome! Session started successfully.", time: "Just now" }
];

document.getElementById('notifBtn').addEventListener('click', () => {
    let notifDropdown = document.getElementById('notifDropdown');
    if (!notifDropdown) {
        notifDropdown = document.createElement('div');
        notifDropdown.id = 'notifDropdown';
        notifDropdown.className = 'notif-dropdown-modal';
        document.body.appendChild(notifDropdown);
        
        document.addEventListener('click', (e) => {
            if (!notifDropdown.contains(e.target) && e.target.id !== 'notifBtn' && !e.target.closest('#notifBtn')) {
                notifDropdown.style.display = 'none';
            }
        });
    }
    
    notifDropdown.innerHTML = `
        <div class="notif-header" style="display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <h4 style="margin: 0; color: white;">App Notifications</h4>
            <button id="closeNotif" style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;">&times;</button>
        </div>
        <div class="notif-list" style="max-height: 250px; overflow-y: auto; padding: 10px;">
            ${appNotifications.length === 0 ? '<div style="color: #94a3b8; text-align: center; padding: 10px;">No new notifications</div>' : 
              appNotifications.map(n => `
                <div class="notif-item" style="padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; color: #e2e8f0;">
                    <div>${n.text}</div>
                    <div style="font-size: 0.7rem; color: #94a3b8; margin-top: 2px;">${n.time}</div>
                </div>
              `).join('')}
        </div>
    `;
    
    document.getElementById('closeNotif').addEventListener('click', () => {
        notifDropdown.style.display = 'none';
    });
    
    notifDropdown.style.display = notifDropdown.style.display === 'block' ? 'none' : 'block';
});

// --- Dynamic Recent Activity Loader ---
async function loadRecentActivities() {
    try {
        const res = await fetch('/api/transactions');
        const transactions = await res.json();
        
        const container = document.getElementById('recentTransactionsContainer');
        if (!container) return;
        
        if (transactions && transactions.length > 0) {
            container.innerHTML = transactions.slice(0, 4).map(tx => `
                <div class="transaction-item" style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
                    <div>
                        <div style="font-weight: 600; color: white;">${tx.title || tx.category}</div>
                        <div style="font-size: 0.8rem; color: #94a3b8;">${tx.type} • ${new Date(tx.date).toLocaleDateString()}</div>
                    </div>
                    <div style="font-weight: 600; color: ${tx.type === 'Income' ? '#22c55e' : '#ef4444'};">
                        ${tx.type === 'Income' ? '+' : '-'}$${Number(tx.amount).toFixed(2)}
                    </div>
                </div>
            `).join('');
        }
    } catch (err) {
        console.error('Failed to load dynamic transactions:', err);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadUserProfile();
    loadRecentActivities();
});
// --- Logout Confirmation Modal Logic ---
const menuLogout = document.getElementById('menuLogout');
if (menuLogout) {
    menuLogout.addEventListener('click', (e) => {
        e.preventDefault();
        
        let logoutModal = document.getElementById('logoutConfirmModal');
        if (!logoutModal) {
            logoutModal = document.createElement('div');
            logoutModal.id = 'logoutConfirmModal';
            logoutModal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 9999;';
            logoutModal.innerHTML = `
                <div style="background: #1e293b; padding: 24px; border-radius: 12px; width: 90%; max-width: 320px; text-align: center; border: 1px solid rgba(255,255,255,0.1);">
                    <h3 style="color: white; margin-bottom: 10px; font-size: 1.2rem;">Log Out</h3>
                    <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;">Are you sure you want to log out of your account?</p>
                    <div style="display: flex; gap: 10px; justify-content: center;">
                        <button id="cancelLogout" style="flex: 1; padding: 10px; background: #334155; border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer;">Cancel</button>
                        <button id="confirmLogout" style="flex: 1; padding: 10px; background: #ef4444; border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer;">Yes</button>
                    </div>
                </div>
            `;
            document.body.appendChild(logoutModal);

            document.getElementById('cancelLogout').addEventListener('click', () => {
                logoutModal.style.display = 'none';
            });

            document.getElementById('confirmLogout').addEventListener('click', () => {
                window.location.href = '/login.html';
            });
        }
        
        logoutModal.style.display = 'flex';
    });
}
// --- Dynamic Dashboard Monetary Amounts Loader ---
async function loadDashboardData() {
    try {
        const res = await fetch('/api/transactions');
        const transactions = await res.json();

        let totalBalance = 0;
        let totalIncome = 0;
        let totalExpense = 0;

        transactions.forEach(tx => {
            const amount = Number(tx.amount) || 0;
            const type = (tx.type || '').toLowerCase();
            
            if (type === 'income') {
                totalIncome += amount;
                totalBalance += amount;
            } else if (type === 'expense' || type === 'expenses') {
                totalExpense += amount;
                totalBalance -= amount;
            }
        });

        const balanceEl = document.getElementById('totalBalance') || document.getElementById('balanceEl');
        const incomeEl = document.getElementById('totalIncome');
        const expenseEl = document.getElementById('totalExpense');

        if (balanceEl) balanceEl.textContent = `$${totalBalance.toFixed(2)}`;
        if (incomeEl) incomeEl.textContent = `$${totalIncome.toFixed(2)}`;
        if (expenseEl) expenseEl.textContent = `$${totalExpense.toFixed(2)}`;

    } catch (err) {
        console.error('Failed to load dashboard monetary amounts:', err);
    }
}
loadDashboardData();

(function() {
    const savedTheme = localStorage.getItem('preferred_theme');
