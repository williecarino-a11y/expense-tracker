<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xylotix - Data Export & Import</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body style="background: #0f172a; color: white; font-family: sans-serif; padding: 20px; margin: 0; padding-bottom: 80px;">
    <div style="max-width: 600px; margin: 0 auto;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
            <h1 style="font-size: 1.5rem; color: #38bdf8; margin: 0;">Data Export & Import</h1>
            <a href="/dashboard.html" style="color: #94a3b8; text-decoration: none; font-size: 0.9rem;">&larr; Back</a>
        </div>

        <!-- Export Data Card -->
        <div style="background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
            <h3 style="font-size: 1.1rem; margin-bottom: 15px; color: #38bdf8;">Export Financial Data</h3>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px;">Download a complete backup of your transaction history, custom categories, and goals.</p>
            <div style="display: flex; gap: 10px;">
                <button style="flex: 1; padding: 12px; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;">Export as CSV</button>
                <button style="flex: 1; padding: 12px; background: #334155; color: #38bdf8; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;">Export as JSON</button>
            </div>
        </div>

        <!-- Import Data Card -->
        <div style="background: #1e293b; padding: 20px; border-radius: 12px;">
            <h3 style="font-size: 1.1rem; margin-bottom: 15px; color: #38bdf8;">Import Data Backup</h3>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px;">Restore or merge financial records from a previously exported backup file.</p>
            <div style="margin-bottom: 15px;">
                <input type="file" style="color: #94a3b8; font-size: 0.9rem;">
            </div>
            <button style="width: 100%; padding: 12px; background: #10b981; color: white; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;">Upload & Restore Data</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar" style="position: fixed; bottom: 0; left: 0; width: 100%; background: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-around; padding: 12px 0;">
        <a href="/dashboard.html" class="nav-item" style="color: #94a3b8; text-decoration: none; font-size: 0.8rem;">Dashboard</a>
        <a href="/reports.html" class="nav-item" style="color: #94a3b8; text-decoration: none; font-size: 0.8rem;">Reports</a>
        <a href="/settings.html" class="nav-item" style="color: #94a3b8; text-decoration: none; font-size: 0.8rem;">Settings</a>
    </div>
</body>
</html>
