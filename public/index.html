<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xylotix - Transaction Dashboard</title>
</head>
<body style="background: #0f172a; color: white; font-family: sans-serif; padding: 20px;">

    <form id="transactionForm" style="background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; max-width: 500px; margin-left: auto; margin-right: auto;">
        <h3 style="font-size: 1.1rem; margin-bottom: 15px; color: #38bdf8;">Add New Transaction</h3>
        
        <!-- Amount & Currency Row -->
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input type="number" id="amount" placeholder="Amount (e.g., 500)" required style="flex: 2; padding: 10px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; box-sizing: border-box;">
            <select id="currency" style="flex: 1; padding: 10px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px;">
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="GBP">GBP (£)</option>
            </select>
        </div>

        <!-- Client Name -->
        <input type="text" id="clientName" placeholder="Client/Company Name" required style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box;">

        <!-- Payment Platform -->
        <select id="paymentPlatform" required style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box;">
            <option value="">Select payment platform</option>
            <option value="bank_transfer">Bank Transfer</option>
            <option value="wise">Wise</option>
            <option value="paypal">PayPal</option>
            <option value="stripe">Stripe</option>
        </select>

        <!-- Date -->
        <input type="date" id="transactionDate" required style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box;">

        <button type="submit" style="width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;">Save Transaction</button>
    </form>
<table id="transactionTable" style="width: 100%; margin-top: 20px; border-collapse: collapse; background: #1e293b; border-radius: 12px; overflow: hidden;">
    <thead>
        <tr style="background: #334155; text-align: left;">
            <th style="padding: 12px;">Date</th>
            <th style="padding: 12px;">Amount</th>
            <th style="padding: 12px;">Currency</th>
            <th style="padding: 12px;">Client</th>
            <th style="padding: 12px;">Platform</th>
            <th style="padding: 12px;">Actions</th>
        </tr>
    </thead>
    <tbody>
        <!-- Dynamic rows will be inserted here -->
    </tbody>
</table>
    <script>
    // Automatically set max date to today
    const dateInput = document.getElementById("transactionDate");
    dateInput.max = new Date().toISOString().split("T")[0];

    // Load saved transactions from Local Storage on startup
    let transactions = JSON.parse(localStorage.getItem("xylotix_transactions")) || [];

    // Function to render transactions into the table 📊
    function renderTransactions() {
        const tbody = document.querySelector("#transactionTable tbody");
        tbody.innerHTML = ""; // Clear existing rows to avoid duplicates

        transactions.forEach(function(tx) {
            tbody.insertAdjacentHTML(
                "beforeend",
                `<tr>
                    <td style="padding: 12px;">${tx.date}</td>
                    <td style="padding: 12px;">${tx.amount}</td>
                    <td style="padding: 12px;">${tx.currency}</td>
                    <td style="padding: 12px;">${tx.clientName}</td>
                    <td style="padding: 12px;">${tx.platform}</td>
                    <td style="padding: 12px;"><button onclick="deleteTransaction(${tx.id})" style="background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Delete</button></td>
                </tr>`
            );
        });
    }

    // Function to delete a transaction 🗑️
    function deleteTransaction(id) {
        transactions = transactions.filter(tx => tx.id !== id);
        localStorage.setItem("xylotix_transactions", JSON.stringify(transactions));
        renderTransactions();
    }

    // Handle form submission and save to Local Storage 💾
    document.getElementById("transactionForm").addEventListener("submit", function(event) {
        event.preventDefault();
        
        const transactionData = {
            id: Date.now(),
            amount: document.getElementById("amount").value,
            currency: document.getElementById("currency").value,
            clientName: document.getElementById("clientName").value,
            platform: document.getElementById("paymentPlatform").value,
            date: dateInput.value
        };

        transactions.push(transactionData);
        localStorage.setItem("xylotix_transactions", JSON.stringify(transactions));
        
        renderTransactions();
        this.reset();
        dateInput.max = new Date().toISOString().split("T")[0];
    });

    // Initial render when page loads
    renderTransactions();
</script>
</body>
</html>
